; Appended by vercel-php to its runtime php.ini (see vercel.json).
; Errors go to the logs (stderr), never into a response, and the PHP version is not advertised.
display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off

; Photo uploads of the admin (docs/CMS.md §13 C10): Vercel refuses request bodies over 4.5 MB before
; PHP sees them, so these only need to let through what the platform accepts; the effective limit
; given to the uploader is App\Cms\Media\MediaManager::maxUploadBytes().
upload_max_filesize = 5M
post_max_size = 6M
